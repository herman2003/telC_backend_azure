# Test gate only. This workflow does NOT deploy.
#
# DigitalOcean App Platform deploys on its own when main changes; the previous
# workflow was deleted deliberately along with that responsibility. What went
# with it, unintentionally, was the build-and-test gate — so a commit that does
# not compile can reach production with nothing objecting.
#
# This restores only the gate. It holds no cloud credentials and cannot deploy.
#
# Note it cannot *block* the DigitalOcean deploy: both react to the same push
# independently. A red run here is a signal to revert, not a barrier. Making it
# a real barrier means moving deploys behind this workflow, which is a larger
# decision than restoring the gate.
name: Test

# `dev` as well as `main`. Everything is validated on dev before it reaches
# main, so a gate that only watches main runs after the decision it was meant
# to inform.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    env:
      # Dummy values only. Several providers call ConfigService.getOrThrow in
      # their constructors, so AppModule cannot instantiate without them — and
      # test/app.e2e-spec.ts imports the whole module. Nothing here reaches a
      # real service: no test makes an outbound call, and the Prisma pool is
      # constructed lazily so no database connection is opened.
      RESEND_API_KEY: ci-dummy-resend-key
      GOOGLE_CLIENT_ID: ci-dummy-google-client-id
      EMAIL_FROM: ci@example.invalid
      FRONTEND_URL: http://localhost:3000
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      # GeminiService throws from onModuleInit without this, which fails
      # app.e2e-spec.ts at module boot. Verified by running the suites
      # locally with .env removed and only these variables set.
      GEMINI_API_KEY: ci-dummy-gemini-key
      # ExamsModule signs audio links with this and reads it through
      # getOrThrow, so the module graph will not build without it. Added after
      # CI caught it: the exam audio work made it required and did not add it
      # here, so app.e2e-spec passed only on a machine with a real .env and
      # failed the first time CI ran on a clean checkout. Nothing verifies a
      # token in these suites; the value only has to exist.
      TOKEN_HMAC_SECRET: ci-dummy-hmac-secret-not-a-real-key
      # JWT secrets are supplied by test/jest-e2e-setup.ts, which pads them to
      # the length AppModule's validation requires. Left unset on purpose so
      # that fallback stays exercised.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        # Required before both build and tests — ts-jest type-checks against the
        # generated client, so this cannot be folded into the build step alone.
        run: npx prisma generate

      - name: Build
        run: npx nest build

      # ts-jest transpiles WITHOUT type-checking, so no type error in test/**
      # can fail a test, and `nest build` compiles src/ only. That blind spot
      # hid three real defects during Phase 6b, each time with a green suite:
      # a service constructed with 3 of its 4 dependencies, a required
      # `provision` argument never passed, and seven fixtures left carrying a
      # dropped column.
      #
      # A ratchet, now at zero. It started at 19; the auth, writing and
      # guest-token specs were repaired while merging dev into main, and the
      # last one — `directUrl` in prisma.config.ts — turned out to be a real
      # bug rather than a typing quirk: the key is not in Prisma 7's
      # datasource type, was ignored at runtime, and every migration had been
      # running over the pooled endpoint instead of the direct one.
      #
      # Keep it at zero. A baseline above zero is a place for the next one to
      # hide.
      #
      # Lower BASELINE whenever the real count drops. It must never be raised.
      - name: Type-check (no new errors)
        run: |
          BASELINE=0
          COUNT=$(npx tsc --noEmit 2>&1 | grep -c "error TS" || true)
          echo "tsc --noEmit reported $COUNT error(s); baseline is $BASELINE"
          if [ "$COUNT" -gt "$BASELINE" ]; then
            echo "::error::$COUNT type errors, above the baseline of $BASELINE."
            npx tsc --noEmit 2>&1 | grep "error TS" || true
            exit 1
          fi
          if [ "$COUNT" -lt "$BASELINE" ]; then
            echo "::notice::Down to $COUNT. Lower BASELINE in this workflow to $COUNT."
          fi

      # Not `npm run lint`: that script carries `--fix`, so in CI it would repair
      # the code, exit clean, and throw the repair away with the runner. The gate
      # has to read the code as it was pushed.
      #
      # A ratchet rather than a wall, for the same reason the type-check above is
      # one: the repo stands at 949 errors across src and test, most of them
      # `no-unsafe-*` on Prisma results and test fixtures. A gate that demanded
      # zero today would be red on every push, and a gate that is always red is a
      # gate everybody learns to scroll past.
      #
      # What this does catch is the thing that actually happened: a merge reached
      # dev carrying two unused constants that failed lint locally, and nothing
      # was watching. Adding two errors moves the count above the baseline and
      # fails, whatever the baseline is.
      #
      # Lower BASELINE whenever the real count drops. It must never be raised: the
      # only way this number goes up is by someone deciding it should.
      - name: Lint (no new errors)
        run: |
          BASELINE=949
          npx eslint "{src,apps,libs,test}/**/*.ts" -f json > eslint.json || true
          COUNT=$(node -e "const r=require('./eslint.json');let e=0;for(const f of r)e+=f.errorCount;console.log(e)")
          echo "eslint reported $COUNT error(s); baseline is $BASELINE"
          if [ "$COUNT" -gt "$BASELINE" ]; then
            echo "::error::$COUNT lint errors, above the baseline of $BASELINE."
            npx eslint "{src,apps,libs,test}/**/*.ts" || true
            exit 1
          fi
          if [ "$COUNT" -lt "$BASELINE" ]; then
            echo "::notice::Down to $COUNT. Lower BASELINE in this workflow to $COUNT."
          fi

      - name: Unit tests
        run: npx jest --ci

      - name: End-to-end tests
        run: npx jest --ci --config ./test/jest-e2e.json

      # THE INTEGRATION SUITE IS NOT RUN HERE, AND THAT IS THE REMAINING HOLE.
      #
      # It is 26 suites and 335 tests against real Postgres, and it is where the
      # payment, period and activation rules are actually pinned — a merge reached
      # dev with it red, which is what prompted adding the lint step above.
      #
      # Running it here needs three things, none of them hard but none of them
      # free:
      #
      #   1. a `postgres` service container, so runs cannot collide the way they
      #      would sharing one Neon branch (the suite deletes shared center and
      #      student rows and already runs maxWorkers: 1 for that reason);
      #   2. `prisma migrate deploy` against it;
      #   3. the Modelltest seeds — 002_seed_modelltest1.sql and the files after
      #      it. Migrations alone are not enough: exam-sitting-integration.spec.ts
      #      reads "the Hören exercise of Modelltest 1, as seeded", and several
      #      other suites do the same.
      #
      # Step 3 is the work. It is deliberately not guessed at here, because a job
      # that lands red makes CI noise for everybody and teaches people to ignore
      # it, which is worse than a gate that honestly says what it does not cover.
      # Tracked in tasks/phases/24-integration-in-ci-todo.md.
